name: Retry runner outages
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: write
jobs:
  retry:
    # A hosted runner that never turns up (macOS arm64 capacity, mostly) leaves
    # its job cancelled with no steps and the run red, which skips promote.
    # Rerun those, but never a run where something actually failed. Runs that
    # concurrency cancelled conclude `cancelled`, not `failure`, so they never
    # reach here.
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < 3
    steps:
      - name: Rerun jobs that never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          jobs_url="repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100"
          failed=$(gh api "$jobs_url" --jq '[.jobs[] | select(.conclusion == "failure")] | length')
          unrun=$(gh api "$jobs_url" \
            --jq '[.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0) | .name] | join(", ")')
          if [ "$failed" -gt 0 ] || [ -z "$unrun" ]; then
            echo "Not retrying: $failed failed job(s); never got a runner: ${unrun:-none}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          echo ":repeat: Attempt $RUN_ATTEMPT lost a runner for: $unrun. Rerunning." >> "$GITHUB_STEP_SUMMARY"
