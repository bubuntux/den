name: Build configurations
on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Artifact to download before building (empty to skip)'
        type: string
        default: ''
      upload-error-logs:
        description: 'Upload build logs as artifacts on failure'
        type: boolean
        default: false
      fail-fast:
        description: 'Stop remaining builds when one fails'
        type: boolean
        default: true
      caddy-hash:
        description: >-
          When set, patch the caddy.withPlugins hash in reverse-proxy.nix to
          this value before building. Used by the self-heal rebuild to verify a
          refreshed hash. Passed as a plain string so it can never suffer the
          artifact-path flattening that broke the old file-shuttling heal.
        type: string
        default: ''
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
      homes: ${{ steps.homes.outputs.homes }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        if: inputs.artifact-name != ''
        with:
          name: ${{ inputs.artifact-name }}
      - uses: cachix/install-nix-action@v31
      - id: hosts
        run: |
          hosts=$(nix eval .#nixosConfigurations --apply 'builtins.attrNames' --json)
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo '### Discovered configurations' >> "$GITHUB_STEP_SUMMARY"
          echo "**NixOS hosts:** $(echo "$hosts" | jq -r 'map("`\(.)`") | join(", ")')" >> "$GITHUB_STEP_SUMMARY"
      - id: homes
        run: |
          homes=$(nix eval .#homeConfigurations --apply 'builtins.attrNames' --json)
          echo "homes=$homes" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$homes" | jq 'length')" -gt 0 ]; then
            echo "**Home Manager:** $(echo "$homes" | jq -r 'map("`\(.)`") | join(", ")')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**Home Manager:** none' >> "$GITHUB_STEP_SUMMARY"
          fi
  hosts:
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        host: ${{ fromJSON(needs.discover.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        if: inputs.artifact-name != ''
        with:
          name: ${{ inputs.artifact-name }}
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        continue-on-error: true
        with:
          name: den
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      # Helix resolves every tree-sitter grammar with an unhashed eval-time
      # fetch, so a cold runner re-fetches ~280 repos and any one of them being
      # down fails the build. Warm, this answers them without the network.
      # Saved even on failure so a partial fetch still counts.
      - name: Restore Nix fetcher cache
        id: nix-fetch-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nix
          key: nix-fetch-${{ matrix.host }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-fetch-${{ matrix.host }}-
            nix-fetch-
      - name: Apply refreshed caddy hash
        if: inputs.caddy-hash != ''
        uses: ./.github/actions/caddy-heal
        with:
          hash: ${{ inputs.caddy-hash }}
      - name: Build NixOS configuration
        run: |
          set -o pipefail
          echo "### NixOS: \`${{ matrix.host }}\`" >> "$GITHUB_STEP_SUMMARY"
          if nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" 2>&1 | tee build.log; then
            echo ':white_check_mark: Build succeeded' >> "$GITHUB_STEP_SUMMARY"
            store_path=$(readlink -f result)
            echo "- **Store path:** \`$store_path\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo ':x: Build failed' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload error log
        if: failure() && inputs.upload-error-logs
        uses: actions/upload-artifact@v7
        with:
          name: error-nixos-${{ matrix.host }}
          path: build.log
      - name: Save Nix fetcher cache
        if: always() && steps.nix-fetch-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nix
          key: nix-fetch-${{ matrix.host }}-${{ hashFiles('flake.lock') }}
  homes:
    runs-on: ubuntu-latest
    needs: discover
    if: ${{ fromJSON(needs.discover.outputs.homes)[0] != null }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        home: ${{ fromJSON(needs.discover.outputs.homes) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        if: inputs.artifact-name != ''
        with:
          name: ${{ inputs.artifact-name }}
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        continue-on-error: true
        with:
          name: den
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - name: Restore Nix fetcher cache
        id: nix-fetch-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nix
          key: nix-fetch-${{ matrix.home }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-fetch-${{ matrix.home }}-
            nix-fetch-
      - name: Build Home Manager configuration
        run: |
          set -o pipefail
          echo "### Home Manager: \`${{ matrix.home }}\`" >> "$GITHUB_STEP_SUMMARY"
          if nix build ".#homeConfigurations.${{ matrix.home }}.activationPackage" 2>&1 | tee build.log; then
            echo ':white_check_mark: Build succeeded' >> "$GITHUB_STEP_SUMMARY"
            store_path=$(readlink -f result)
            echo "- **Store path:** \`$store_path\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo ':x: Build failed' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload error log
        if: failure() && inputs.upload-error-logs
        uses: actions/upload-artifact@v7
        with:
          name: error-hm-${{ matrix.home }}
          path: build.log
      - name: Save Nix fetcher cache
        if: always() && steps.nix-fetch-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nix
          key: nix-fetch-${{ matrix.home }}-${{ hashFiles('flake.lock') }}
